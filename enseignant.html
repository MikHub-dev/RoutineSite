<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="famzak-verrou.js?v=3" onerror="document.documentElement.hidden=true"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace enseignant · RoutineSite</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
  .eleve { background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px; padding: 18px 22px; margin-bottom: 18px; }
  .eleve-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .eleve h2 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  .parcours { margin-top: 14px; }
  .parcours-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .parcours h3 { margin: 0; font-size: 16px; }
  .parcours h3 small { color: var(--doux); font-weight: 400; margin-left: 8px; }
  .grille { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; max-width: 640px; }
  .case {
    padding: 6px 0; text-align: center; font-size: 13px; border-radius: 6px; border: 1px solid var(--bord);
    background: var(--panneau-2); color: var(--doux); font-family: inherit;
  }
  .case.fait { background: #143a2a; border-color: var(--vert); color: var(--vert); font-weight: 700; cursor: pointer; }
  .case.fait:hover, .case.fait:focus-visible { background: #3a1a1a; border-color: var(--rouge); color: var(--rouge); outline: none; }
  .case.fait:hover::after, .case.fait:focus-visible::after { content: ""; }
  .case:disabled { cursor: default; }
  .aide { color: var(--doux); font-size: 14px; margin: 0 0 18px; }
  .barre { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .message { color: var(--vert); font-size: 14px; margin: 0 0 12px; }
  .message:empty { display: none; }
  [hidden] { display: none !important; }
  .catalogue { margin-bottom: 26px; }
  .catalogue h2 { margin: 0 0 6px; font-size: 22px; }
  .catalogue details { margin-bottom: 10px; background: var(--panneau); }
  .catalogue summary { font-size: 17px; }
  .catalogue summary small { color: var(--doux); font-weight: 400; margin-left: 8px; }
  .module-ens { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--bord); }
  .module-ens:first-of-type { margin-top: 12px; }
  .module-ens h3 { margin: 0; font-size: 15px; }
  .module-ens h3 small { display: block; color: var(--doux); font-weight: 400; font-size: 13px; margin-top: 2px; }
  .grille-liens { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; max-width: 640px; }
  .jour-lien { display: block; padding: 8px 0; text-align: center; border-radius: 8px; border: 1px solid var(--bord);
    background: var(--panneau-2); color: var(--texte); text-decoration: none; font-size: 14px; }
  .jour-lien:hover, .jour-lien:focus-visible { border-color: var(--bleu); color: var(--bleu); outline: none; }
  .jour-lien.bilan { border-style: dashed; }
  @media (max-width: 760px) { .module-ens { grid-template-columns: 1fr; } }
  .parole-ens { margin-bottom: 26px; }
  .parole-ens h2 { margin: 0 0 6px; font-size: 22px; }
  .seance-p { background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
  .seance-p h3 { margin: 0 0 6px; font-size: 17px; }
  .seance-p h3 small { color: var(--doux); font-weight: 400; margin-left: 8px; }
  .seance-p h4 { margin: 14px 0 4px; font-size: 15px; }
  .seance-p pre { white-space: pre-wrap; font: inherit; font-size: 14px; color: var(--doux); background: var(--panneau-2); border: 1px solid var(--bord); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .notes-tab { border-collapse: collapse; font-size: 14px; margin: 4px 0; }
  .notes-tab th, .notes-tab td { padding: 4px 14px 4px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--bord); }
  .notes-tab th { color: var(--doux); font-weight: 600; font-size: 13px; }
  .notes-tab input { width: 72px; padding: 4px 6px; background: var(--fond); color: var(--texte); border: 1px solid var(--bord); border-radius: 6px; font: inherit; text-transform: none; letter-spacing: 0; }
  .seance-p textarea { width: 100%; min-height: 84px; resize: vertical; padding: 8px 10px; background: var(--fond); color: var(--texte); border: 1px solid var(--bord); border-radius: 6px; font: inherit; font-size: 14px; margin-top: 8px; }
  .seance-p .barre { margin: 10px 0 0; }
  .total-p { font-weight: 700; margin: 6px 0 0; }
  .grille-details h4 { margin: 14px 0 4px; }
  .small { font-size: 13px; color: var(--doux); }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; }
  .ov-boite { background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px; padding: 20px 24px; max-width: 580px; width: calc(100% - 32px); max-height: 90vh; overflow: auto; }
  .ov-boite h3 { margin: 0 0 8px; font-size: 19px; }
  .ov-choix { margin: 14px 0; }
  .ov-choix .small { margin: 6px 0 0; }
  .btn--danger { background: var(--rouge); border-color: var(--rouge); color: #0f1116; }
  .btn--danger:hover { background: #ff8a8a; }
  .ecrit-ens { margin-bottom: 26px; }
  .ecrit-ens h2 { margin: 0 0 6px; font-size: 22px; }
  .ecrit-ens .statut { font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--bord); margin-left: 8px; }
  .ecrit-ens .statut.corrige { color: var(--vert); border-color: var(--vert); }
  .ecrit-ens .statut.attente { color: var(--ambre, #e3b053); border-color: var(--ambre, #e3b053); }
  .ecrit-ens .statut.probleme { color: var(--rouge); border-color: var(--rouge); }
  .ecrit-ens .alerte { color: var(--ambre, #e3b053); font-size: 14px; margin: 6px 0; }
  .ecrit-ens textarea.texte-corr { min-height: 260px; }
  .ecrit-ens .score-ligne input { width: 64px; padding: 4px 6px; background: var(--fond); color: var(--texte); border: 1px solid var(--bord); border-radius: 6px; font: inherit; }
  .archive-groupe h4 { margin: 14px 0 4px; font-size: 15px; }
  .archive-groupe ul, .seance-p ul.audios { margin: 4px 0 0; padding-left: 20px; }
  .archive-groupe li, .seance-p ul.audios li { padding: 3px 0; }
</style>
</head>
<body>

<header id="navbar">
  <div class="nav-left"><a class="famzak-retour" href="https://famzak.github.io/" title="Retour à FamZakSites" style="flex:none;white-space:nowrap;font-size:.85rem;color:#9fb3d6;text-decoration:none;margin-right:1rem">&larr; FamZakSites</a>
    <div class="logo-mark" aria-hidden="true">30'</div>
    <div class="logo-text">
      <span class="logo">RoutineSite</span>
      <span class="logo-tagline">Espace enseignant</span>
    </div>
  </div>
  <nav class="nav-links" aria-label="Navigation">
    <a href="index.html">Accueil</a>
    <button type="button" id="quitter" hidden>Se déconnecter</button>
  </nav>
</header>

<main class="page" id="contenu"></main>

<script src="commun.js"></script>
<script src="parole-grille.js"></script>
<script>
const CLE_ADMIN = "routinesite:admin";
const NOMS = { probabilites: "Probabilités en 100 jours", technologie: "Technologie numérique en 100 jours" };
const NOMS_ALL = { ...NOMS, parole: "Fluidité verbale en 100 jours" };
const FICHIERS = { probabilites: "data/probabilites.json", technologie: "data/technologie.json" };

const lireMdp = () => { try { return sessionStorage.getItem(CLE_ADMIN) || ""; } catch (e) { return ""; } };
const ecrireMdp = m => { try { m ? sessionStorage.setItem(CLE_ADMIN, m) : sessionStorage.removeItem(CLE_ADMIN); } catch (e) {} };
const appelRemise = (e, routine, jour) => {
  const j = jour === "tous" ? "'tous'" : jour;
  return routine === "parole" ? `reinitParole('${e.empreinte}','${esc(nomEleve(e))}',${j})` : `remettre('${e.empreinte}','${esc(nomEleve(e))}','${routine}',${j})`;
};
const dateFr = iso => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });

function pageConnexion(erreur) {
  document.getElementById("quitter").hidden = true;
  document.getElementById("contenu").innerHTML = `
    <h1 class="titre">Espace enseignant</h1>
    <p class="sous-titre">Suivi des jours faits par élève. Même mot de passe que l'espace enseignant de MathSite.</p>
    <section class="vignette" style="max-width:520px">
      <label class="code-label" for="mdp">Mot de passe</label>
      <form class="champ-ligne" onsubmit="connecter(); return false;">
        <input class="input" id="mdp" type="password" autocomplete="current-password" style="text-transform:none;letter-spacing:0">
        <button class="btn" type="submit">Entrer</button>
      </form>
      <p class="erreur" id="erreur" role="alert">${esc(erreur || "")}</p>
    </section>`;
  const m = document.getElementById("mdp"); if (m) m.focus();
}

function pageNonConfiguree() {
  document.getElementById("contenu").innerHTML = `
    <h1 class="titre">Espace enseignant</h1>
    <section class="vignette"><p>Le suivi n'est pas encore activé : le Worker n'est pas déployé ou son adresse n'est pas renseignée
      (<code>URL_SUIVI</code> dans <code>commun.js</code>). Les étapes sont dans <code>worker/LISEZMOI.md</code>.</p></section>`;
}

async function connecter() {
  const m = document.getElementById("mdp").value;
  if (!m) return;
  ecrireMdp(m);
  await afficher();
}

async function afficher() {
  if (!URL_SUIVI) return pageNonConfiguree();
  const mdp = lireMdp();
  if (!mdp) return pageConnexion();
  let reponse;
  try { reponse = await appelerSuivi("/admin/etat", { motdepasse: mdp }); }
  catch (e) {
    if (e.statut === 401 || e.statut === 429) { ecrireMdp(""); return pageConnexion(e.message); }
    document.getElementById("contenu").innerHTML = `<p class="erreur">Le serveur de suivi ne répond pas : ${esc(e.message)}. <button class="lien" onclick="afficher()">Réessayer</button></p>`;
    return;
  }
  document.getElementById("quitter").hidden = false;
  const eleves = reponse.eleves;
  const catalogue = await chargerCatalogue();
  let envoisEcrits = null, ecritErreur = "";
  try { envoisEcrits = (await appelerSuivi("/admin/reponses", { motdepasse: mdp }, 20000)).envois; }
  catch (e) { ecritErreur = e.statut === 404 ? "Le Worker n'a pas encore été mis à jour (route /admin/reponses absente) : republiez-le, voir worker/LISEZMOI.md." : e.message; }
  let paroleSeances = null, paroleErreur = "";
  try { paroleSeances = (await appelerSuivi("/admin/parole", { motdepasse: mdp })).seances; }
  catch (e) { paroleErreur = e.statut === 404 ? "Le Worker n'a pas encore été mis à jour (route /admin/parole absente) : redéployez-le, voir worker/LISEZMOI.md." : e.message; }
  document.getElementById("contenu").innerHTML = `
    <h1 class="titre">Suivi des élèves</h1>
    <p class="aide">Une case verte est un jour fait. Cliquez sur une case verte pour la remettre à « non fait » : l'élève devra le refaire et le renvoyer.</p>
    <div class="barre"><button class="btn btn--secondaire" onclick="afficher()">Actualiser</button><span class="aide" style="margin:0">${eleves.length} élève${eleves.length > 1 ? "s" : ""} avec au moins un jour fait</span></div>
    <p class="message" id="message" role="status"></p>
    ${catalogueHtml(catalogue)}
    ${ecritSectionHtml(envoisEcrits, ecritErreur)}
    ${paroleSectionHtml(paroleSeances, paroleErreur)}
    ${eleves.length ? eleves.map(eleveHtml).join("") : `<p class="aide">Aucun jour n'a encore été enregistré.</p>`}`;
  initTotaux();
}

// Modules et jours de chaque routine, pour les liens vers les exercices et leurs corrigés (null si le fichier ne se charge pas).
let catalogueMemo = null;
async function chargerCatalogue() {
  if (catalogueMemo) return catalogueMemo;
  const cat = {};
  for (const r of Object.keys(FICHIERS)) {
    try {
      const d = await (await fetch(FICHIERS[r])).json();
      if (!Array.isArray(d.modules) || !Array.isArray(d.jours)) throw new Error("format");
      cat[r] = d;
    } catch (e) { cat[r] = null; }
  }
  if (Object.values(cat).every(Boolean)) catalogueMemo = cat;
  return cat;
}

function catalogueHtml(cat) {
  return `<section class="catalogue" id="catalogue">
    <h2>Exercices et corrigés</h2>
    <p class="aide">Cliquez sur un jour pour ouvrir ses trois exercices avec leurs corrigés. Cette vue ne change rien au suivi des élèves.</p>
    ${Object.keys(NOMS).map(r => routineCatalogueHtml(r, cat[r])).join("")}
  </section>`;
}

function routineCatalogueHtml(routine, d) {
  if (!d) return `<details id="exos-${routine}"><summary>${esc(NOMS[routine])}</summary><p class="erreur">Impossible de charger les séances (ouvrez le site depuis son adresse en ligne).</p></details>`;
  const modules = d.modules.map(m => {
    const jours = d.jours.filter(j => j.module === m.id);
    return `<div class="module-ens">
      <h3>${esc(m.titre)}<small>${esc(m.niveau)} · jours ${jours[0].n} à ${jours[jours.length - 1].n}</small></h3>
      <div class="grille-liens">${jours.map(j => `<a class="jour-lien${j.n % 10 === 0 ? " bilan" : ""}" href="corrige.html?r=${routine}&j=${j.n}" title="${esc("Jour " + j.n + " · " + (j.titreTxt || j.titre) + " — exercices et corrigés")}">${j.n}</a>`).join("")}</div>
    </div>`;
  }).join("");
  return `<details id="exos-${routine}"><summary>${esc(NOMS[routine])}<small>${d.jours.length} jours · 3 exercices corrigés par jour</small></summary>${modules}</details>`;
}

function ouvrirCatalogue(routine) {
  const d = document.getElementById("exos-" + routine);
  if (!d) return;
  d.open = true;
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}

function eleveHtml(e) {
  const total = Object.values(e.jours).reduce((s, l) => s + l.length, 0);
  return `<section class="eleve">
    <div class="eleve-tete"><h2>${esc(nomEleve(e))}</h2><span class="aide" style="margin:0">${esc(nomClasse(e.classe))} · ${total} jour${total > 1 ? "s" : ""} fait${total > 1 ? "s" : ""}</span></div>
    ${Object.keys(NOMS_ALL).map(r => parcoursHtml(e, r)).join("")}
  </section>`;
}

function parcoursHtml(e, routine) {
  const faits = new Map((e.jours[routine] || []).map(j => [j.n, j.date]));
  const cases = Array.from({ length: 100 }, (_, i) => {
    const n = i + 1;
    return faits.has(n)
      ? `<button class="case fait" title="Jour ${n} fait le ${esc(dateFr(faits.get(n)))} — cliquer pour remettre à « non fait »" onclick="${appelRemise(e, routine, n)}">${n}</button>`
      : `<button class="case" disabled title="Jour ${n} : non fait">${n}</button>`;
  }).join("");
  return `<div class="parcours">
    <div class="parcours-tete"><h3>${esc(NOMS_ALL[routine])}<small>${faits.size}/100</small></h3>
      <span>${FICHIERS[routine] ? `<button class="lien" onclick="ouvrirCatalogue('${routine}')">Exercices et corrigés</button>` : `<button class="lien" onclick="ouvrirParole()">Séances de parole</button>`}${faits.size ? ` · <button class="lien" onclick="${appelRemise(e, routine, 'tous')}">Tout remettre à « non fait »</button>` : ""}</span></div>
    <div class="grille">${cases}</div></div>`;
}

// Nom affiché d'un élève : son prénom (renvoyé par le serveur), jamais son code ZF.
function nomEleve(x) {
  if (x && x.prenom) return x.prenom;
  const emp = (x && (x.empreinte || (typeof x.cle === "string" && x.cle.split(":")[1]))) || "";
  return emp ? `Élève ${emp.slice(0, 6)}` : "Élève";
}

async function remettre(empreinte, nom, routine, jour) {
  const quoi = jour === "tous" ? `tous les jours de « ${NOMS_ALL[routine]} »` : `le jour ${jour} de « ${NOMS_ALL[routine]} »`;
  if (!confirm(`Remettre ${quoi} à « non fait » pour ${nom} ?`)) return;
  try {
    await appelerSuivi("/admin/reinitialiser", { motdepasse: lireMdp(), empreinte, routine, jour });
  } catch (e) {
    if (e.statut === 401) { ecrireMdp(""); return pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); }
    alert("Échec : " + e.message); return;
  }
  await afficher();
  document.getElementById("message").textContent = `✓ ${nom} : ${quoi} remis à « non fait ».`;
}

// ---------- Probabilités et Technologie : corrections de Claude ----------
let ENVOIS = {};
const STATUTS = {
  corrige: ["corrige", "corrigé"], en_cours: ["attente", "correction en cours"], echec: ["probleme", "échec de la correction"],
  non_configure: ["probleme", "correction non configurée"], echec_depot: ["probleme", "dépôt privé inaccessible"]
};
function ecritSectionHtml(envois, erreur) {
  let corps;
  if (erreur) corps = `<p class="erreur">${esc(erreur)}</p>`;
  else if (!envois.length) corps = `<p class="aide">Aucun envoi pour l'instant. Ils apparaissent ici dès qu'un élève envoie ses réponses à une séance de Probabilités ou de Technologie numérique.</p>`;
  else {
    ENVOIS = Object.fromEntries(envois.map(e => [e.cle, e]));
    const aRelire = envois.filter(e => e.statut === "corrige" && !e.valideLe).length;
    corps = `<p class="aide">${envois.length} envoi${envois.length > 1 ? "s" : ""} · ${aRelire} correction${aRelire > 1 ? "s" : ""} pas encore relue${aRelire > 1 ? "s" : ""}.</p>`
      + envois.slice().reverse().map(envoiHtml).join("");
  }
  return `<section class="ecrit-ens" id="ecrit-ens">
    <details${erreur ? " open" : ""}><summary><h2 style="display:inline">Probabilités et Technologie : corrections de Claude</h2></summary>
    <p class="aide">Chaque envoi d'un élève est corrigé automatiquement par Claude (GitHub Action du dépôt privé, sur votre abonnement), d'après le corrigé du jour. L'élève voit la correction dès qu'elle est prête. Vous pouvez modifier le texte ou le score puis « Enregistrer » : l'élève voit alors votre version, marquée « relue par ton enseignant ».</p>
    ${corps}</details></section>`;
}
function envoiHtml(e) {
  const [cls, lib] = STATUTS[e.statut] || ["probleme", e.statut];
  const c = e.correction || {}, auto = e.correctionAuto || {};
  const id = e.cle.replace(/[^a-z0-9]/gi, "_");
  return `<div class="seance-p" id="env-${id}">
    <h3>${esc(nomEleve(e))} · ${esc(NOMS[e.routine])} · jour ${e.jour} · essai ${e.essai || 1}<small>${esc(dateFr(e.date))}</small>
      <span class="statut ${cls}">${esc(lib)}${e.valideLe ? " · relue" : ""}</span></h3>
    <p class="small"><a class="lien" href="corrige.html?r=${e.routine}&j=${e.jour}" target="_blank" rel="noopener">Énoncés et corrigé du jour</a>${e.erreur ? ` · ${esc(e.erreur)}` : ""}</p>
    ${auto.aVerifier ? `<p class="alerte">⚠ Claude signale : ${esc(auto.aVerifier)}</p>` : ""}
    <h4>Réponses de l'élève</h4>
    ${(e.reponses || []).map((r, i) => `<pre><b>Exercice ${i + 1} :</b> ${esc(r)}</pre>`).join("")}
    <h4>Correction affichée à l'élève</h4>
    ${(c.questions || auto.questions || []).length ? `<p class="small">${(c.questions || auto.questions).map(q => `Ex. ${q.exercice}·${esc(q.question)} : ${esc(q.verdict)}`).join(" · ")}</p>` : ""}
    <p class="score-ligne">Réponses justes : <input type="number" step="0.5" min="0" id="j-${id}" value="${c.justes ?? ""}"> sur <input type="number" min="1" id="t-${id}" value="${c.total ?? ""}"></p>
    <textarea class="texte-corr" id="x-${id}" placeholder="${e.statut === "en_cours" ? "Correction en cours… (vous pouvez aussi l'écrire vous-même)" : "Texte de correction"}">${esc(c.texte || "")}</textarea>
    <div class="barre">
      <button class="btn" onclick="enregistrerEnvoi('${e.cle}')">Enregistrer</button>
      <button class="btn btn--secondaire" onclick="relancerEnvoi('${e.cle}')">Redemander à Claude</button>
      <button class="lien" onclick="supprimerEnvoi('${e.cle}')">Supprimer</button>
    </div></div>`;
}
const idEnvoi = cle => cle.replace(/[^a-z0-9]/gi, "_");
async function actionEnvoi(route, corps, ok) {
  try { await appelerSuivi(route, { motdepasse: lireMdp(), ...corps }, 20000); }
  catch (e) {
    if (e.statut === 401) { ecrireMdp(""); return pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); }
    alert("Échec : " + e.message); return;
  }
  await afficher();
  const s = document.getElementById("ecrit-ens"); if (s) { s.querySelector("details").open = true; }
  const el = document.getElementById("env-" + idEnvoi(corps.cle)); if (el) el.scrollIntoView({ block: "center" });
  document.getElementById("message").textContent = ok;
}
function enregistrerEnvoi(cle) {
  const id = idEnvoi(cle);
  return actionEnvoi("/admin/reponses/modifier", { cle, texte: document.getElementById("x-" + id).value,
    justes: document.getElementById("j-" + id).value, total: document.getElementById("t-" + id).value }, "✓ Correction enregistrée : l'élève voit votre version.");
}
function relancerEnvoi(cle) {
  if (!confirm("Redemander une correction à Claude pour cet envoi ? La correction actuelle sera remplacée quand la nouvelle arrivera.")) return;
  return actionEnvoi("/admin/reponses/relancer", { cle }, "✓ Correction redemandée à Claude (quelques minutes).");
}
function supprimerEnvoi(cle) {
  if (!confirm("Supprimer cet envoi du suivi ? (Le fichier reste dans le dépôt privé.)")) return;
  return actionEnvoi("/admin/reponses/supprimer", { cle }, "✓ Envoi supprimé.");
}

// ---------- Fluidité verbale : séances, notes, grille ----------
let SEANCES = {};
const TITRES_EX = { ex1: GRILLE.ex1.titre, ex2: GRILLE.ex2.titre };

function paroleSectionHtml(seances, erreur) {
  let corps;
  if (erreur) corps = `<p class="erreur">${esc(erreur)}</p>`;
  else if (!seances.length) corps = `<p class="aide">Aucune séance enregistrée pour l'instant. Elles apparaissent ici dès qu'un élève fait un exercice sur la page « Fluidité verbale ».</p>`;
  else {
    SEANCES = Object.fromEntries(seances.map(s => [s.cle, s]));
    corps = seances.slice().reverse().map(seanceHtml).join("");
  }
  return `<section class="parole-ens" id="parole-ens">
    <h2>Fluidité verbale : séances et notes</h2>
    <p class="aide">Chaque séance est enregistrée par la page de l'élève avec ses mesures, puis notée et commentée automatiquement (Cloudflare Workers AI) : les notes automatiques comptent tout de suite pour l'élève, sans action de votre part. Vous pouvez les corriger et les valider (bouton « Valider / corriger »),  Vos corrections sont mémorisées pour suivre la fiabilité de l'analyse.</p>
    ${resumeParole(seances)}
    ${grilleHtml()}
    ${erreur ? "" : archiveHtml()}
    ${corps}
  </section>`;
}

function resumeParole(seances) {
  if (!seances || !seances.length) return "";
  const aVerifier = seances.filter(s => s.analyse && s.analyse.verifier && !s.notes).length;
  const sansNote = seances.filter(s => !s.notes && !s.notesAuto).length;
  const corriges = seances.filter(s => (s.corrections || []).length).length;
  const nb = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
  return `<p class="aide"><b>${nb(seances.length, "séance")}</b> · ${aVerifier ? `<span style="color:var(--rouge)">${nb(aVerifier, "à vérifier")}</span> (jugement du modèle et indice de proximité des mots en désaccord)` : "aucune à vérifier"} · ${nb(sansNote, "sans note")} · ${nb(corriges, "corrigée")} par vos soins.</p>`;
}
const SOURCES = { modele: "modèle de langage", estimation: "estimation simple", "aucune voix": "aucune voix détectée" };
function analyseHtml(s) {
  const a = s.analyse;
  if (!a) return `<p class="small">Analyse automatique : pas d'analyse (binding AI absent du Worker, ou séance enregistrée avant son activation). <button class="lien" type="button" onclick="relancerAnalyse('${esc(s.cle)}')">Lancer l'analyse</button></p>`;
  const couleur = a.statut === "ok" ? "var(--vert)" : a.statut === "en_cours" ? "var(--doux)" : "var(--rouge)";
  const libelle = { ok: "terminée", en_cours: "en cours", estimation: "terminée avec estimations (modèle indisponible)", echec: "en échec", plafond: "non lancée (plafond atteint)" }[a.statut] || a.statut;
  const src = a.sources ? Object.entries(a.sources).map(([c, v]) => `${c === "liens" ? "liens" : "structure"} : ${SOURCES[v] || v}`).join(" · ") : "";
  const i = a.indices || {};
  const liens = i.liens ? `proximité moyenne des mots consécutifs ${nf(i.liens.moyenne, 2)} (médiane ${nf(i.liens.mediane, 2)}), ${i.liens.sauts} saut(s) sur ${i.liens.n} liens, estimation ${nf(i.estimationLiens)}/10` : "indice des liens indisponible";
  const struct = i.structure ? `${i.structure.mots} mots, ${nf(i.structure.partDifferents * 100, 0)} % de mots différents, ${i.structure.connecteurs} connecteurs, estimation ${nf(i.estimationStructure)}/15` : "";
  const corr = (s.corrections || []).length ? `<p class="small">Vos corrections : ${s.corrections.map(c => `${esc(c.ex === "ex1" ? "ex. 1" : "ex. 2")} ${esc(c.critere)} ${nf(c.auto)} → ${nf(c.final)}`).join(" · ")}</p>` : "";
  const just = a.justifications ? [a.justifications.ex1, a.justifications.ex2].filter(Boolean).map(t => `<li>${esc(t)}</li>`).join("") : "";
  return `<details${a.verifier ? " open" : ""}><summary class="small">Analyse automatique : <span style="color:${couleur}">${esc(libelle)}</span>${a.verifier ? ` · <b style="color:var(--rouge)">à vérifier</b>` : ""}${a.modele ? " · " + esc(a.modele.replace("@cf/", "")) : ""}</summary>
    <p class="small">Source des critères jugés : ${esc(src || "—")}.</p>
    ${a.verifier ? `<p class="small" style="color:var(--rouge)">Le jugement du modèle et l'indice de proximité des mots s'écartent d'au moins 3 points sur les liens : vérifiez la transcription.</p>` : ""}
    <p class="small">Indices : ${esc(liens)}${struct ? " · " + esc(struct) : ""}.</p>
    ${just ? `<ul class="small">${just}</ul>` : ""}
    ${a.erreur ? `<p class="small">Erreur du modèle : ${esc(a.erreur)}</p>` : ""}${corr}
    <button class="lien" type="button" onclick="relancerAnalyse('${esc(s.cle)}')">Relancer l'analyse</button></details>`;
}

function seanceHtml(s) {
  const notes = s.notes || {}, notesAuto = s.notesAuto || {};
  const exos = ["ex1", "ex2"].filter(ex => s[ex]).map(ex => {
    const m = s[ex], auto = m.auto || {};
    const lignes = GRILLE[ex].criteres.map(c => {
      const na = notesAuto[ex] && notesAuto[ex][c.id] != null ? notesAuto[ex][c.id] : (auto[c.id] != null ? auto[c.id] : null);
      const retenue = notes[ex] && notes[ex][c.id] != null ? notes[ex][c.id] : (na != null ? na : "");
      return `<tr><td>${esc(c.nom)} <span class="small">(${esc(c.type)})</span></td><td>${na != null ? nf(na) : "—"}</td>
        <td><input type="number" min="0" max="${c.max}" step="0.5" data-ex="${ex}" data-c="${c.id}" value="${esc(retenue)}" oninput="majTotaux('${esc(s.cle)}')"> <span class="small">/ ${c.max}</span></td></tr>`;
    }).join("");
    const resume = ex === "ex1"
      ? `${nf(m.mots, 0)} mots (${nf(m.differents, 0)} différents) · ${nf(m.blancs, 0)} blancs ≥ 2 s · plus longue pause ${nf(m.plusLongue)} s · délai ${nf(m.delai)} s · silence final ${nf(m.silenceFinal)} s`
      : `${nf(m.mots, 0)} mots · débit ${nf(m.debit, 0)} mots/min · ${nf(m.pauses, 0)} pauses ≥ 0,7 s dont ${nf(m.blancs, 0)} blancs · hauteur ${nf(m.hauteurSt)} demi-tons · volume ${nf(m.tendanceDb)} dB · mot imposé : ${m.motImpose == null ? "—" : (m.motImpose ? "utilisé" : "absent")}`;
    return `<h4>${esc(TITRES_EX[ex])}</h4>
      <p class="small">${esc(resume)}</p>
      <details><summary class="small">Transcription</summary><pre>${esc(m.texte || "(vide)")}</pre></details>
      <table class="notes-tab"><thead><tr><th>Critère</th><th>Automatique</th><th>Note retenue</th></tr></thead><tbody>${lignes}</tbody></table>
      <p class="total-p" data-total="${ex}"></p>`;
  }).join("");
  const etat = s.notes ? `<span style="color:var(--vert)">✓ validé${s.notesLe ? " le " + esc(dateFr(s.notesLe)) : ""}</span>`
    : s.analyse && s.analyse.statut === "en_cours" ? `<span>analyse en cours</span>`
    : s.notesAuto ? `<span style="color:var(--bleu)">noté automatiquement${s.analyse && s.analyse.verifier ? " · à vérifier" : ""}</span>` : `<span style="color:var(--rouge)">à noter</span>`;
  return `<div class="seance-p" id="seance-${esc(s.cle.replace(/:/g, "_"))}" data-cle="${esc(s.cle)}">
    <h3>${esc(nomEleve(s))} · ${esc(nomClasse(s.classe))} · jour ${esc(s.jour)}<small>${esc(dateFr(s.date))} · ${etat}</small></h3>
    ${audiosHtml(s)}
    ${analyseHtml(s)}
    ${exos}
    <label class="small" for="retour-${esc(s.cle.replace(/:/g, "_"))}">Retour montré à l'élève (automatique ; vous pouvez le modifier)</label>
    <textarea id="retour-${esc(s.cle.replace(/:/g, "_"))}" data-retour>${esc(s.retour || (s.analyse && s.analyse.retour) || "")}</textarea>
    <div class="barre"><button class="btn" type="button" onclick="enregistrerNotes('${esc(s.cle)}')">Valider / corriger les notes</button>
      <button class="lien" type="button" onclick="reinitParole('${esc(s.cle.split(":")[1])}','${esc(nomEleve(s))}',${Number(s.jour)})">Remettre ce jour à zéro…</button>
      <button class="lien" type="button" onclick="supprimerSeance('${esc(s.cle)}')">Supprimer cette séance seulement</button>
      <span class="small" data-msg></span></div>
  </div>`;
}

const boutonsArchive = chemin => `<button class="lien" type="button" data-audio="${esc(chemin)}" data-act="ecouter">▶ Écouter</button> · <button class="lien" type="button" data-audio="${esc(chemin)}" data-act="telecharger">Télécharger</button>`;
function audiosHtml(s) {
  const a = s.audios || [];
  if (!a.length) return `<p class="small">Aucun enregistrement audio archivé pour cette séance.</p>`;
  return `<p class="small" style="margin:6px 0 0">Enregistrements archivés (accès protégé par le mot de passe enseignant) :</p>
    <ul class="audios small">${a.map(x => `<li>${x.exo === "ex1" ? "Exercice 1" : "Exercice 2"}${x.duree ? " (" + nf(x.duree, 0) + " s)" : ""} · ${esc(dateFr(x.date))} — ${boutonsArchive(x.chemin)}</li>`).join("")}</ul>`;
}

// Archive complète (dépôt privé) : liste, lecture et téléchargement réservés au mot de passe enseignant.
function archiveHtml() {
  return `<details id="archive-ens"><summary>Archive audio (dépôt privé) : accès protégé par le mot de passe enseignant</summary>
    <p class="aide" style="margin-top:10px">Tous les enregistrements archivés, y compris ceux d'un jour remis à zéro avec conservation des audios. Les fichiers ne sont servis qu'après vérification du mot de passe ; ils ne sont lisibles nulle part ailleurs sur le site.</p>
    <div class="barre"><button class="btn btn--secondaire" type="button" onclick="chargerArchive()">Charger l'archive</button><span class="small" id="archive-msg"></span></div>
    <div id="archive-liste"></div></details>`;
}
async function chargerArchive() {
  const msg = document.getElementById("archive-msg"), zone = document.getElementById("archive-liste");
  msg.textContent = "Chargement…";
  let r;
  try { r = await appelerSuivi("/admin/parole/archive", { motdepasse: lireMdp() }, 30000); }
  catch (e) {
    if (e.statut === 401) { ecrireMdp(""); return pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); }
    msg.textContent = "Échec : " + e.message; return;
  }
  msg.textContent = `${r.fichiers.length} fichier${r.fichiers.length > 1 ? "s" : ""}${r.tronque ? " (liste tronquée)" : ""}`;
  const groupes = {};
  r.fichiers.forEach(f => { const g = `${nomEleve(f)}|${f.classe}|${String(f.jour).padStart(3, "0")}`; (groupes[g] = groupes[g] || []).push(f); });
  zone.innerHTML = Object.keys(groupes).sort().map(k => {
    const [nom, classe, jour] = k.split("|");
    return `<div class="archive-groupe"><h4>${esc(nom)} · ${esc(nomClasse(classe))} · jour ${Number(jour)}</h4><ul class="small">${groupes[k].map(f => {
      const donnees = f.nom.endsWith(".json");
      return `<li>${donnees ? "Sauvegarde des données (remise à zéro)" : esc(f.nom)} (${nf(f.taille / 1024, 0)} Ko) — ${donnees ? `<button class="lien" type="button" data-audio="${esc(f.chemin)}" data-act="telecharger">Télécharger</button>` : boutonsArchive(f.chemin)}</li>`;
    }).join("")}</ul></div>`;
  }).join("") || `<p class="aide">L'archive est vide.</p>`;
}

// Lecture / téléchargement d'un fichier de l'archive : demandé au Worker avec le mot de passe (jamais d'adresse publique).
async function recupererArchive(chemin) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(URL_SUIVI.replace(/\/+$/, "") + "/admin/parole/audio", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ motdepasse: lireMdp(), chemin }), signal: ctl.signal });
    if (!r.ok) { const d = await r.json().catch(() => ({})); const e = new Error(d.erreur || `Erreur ${r.status}`); e.statut = r.status; throw e; }
    return await r.blob();
  } finally { clearTimeout(t); }
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest && ev.target.closest("[data-audio]");
  if (!b) return;
  const chemin = b.dataset.audio, texte = b.textContent;
  b.disabled = true; b.textContent = "Chargement…";
  try {
    const blob = await recupererArchive(chemin), url = URL.createObjectURL(blob);
    if (b.dataset.act === "telecharger") {
      const a = document.createElement("a"); a.href = url; a.download = chemin.split("/").pop(); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } else {
      const lecteur = document.createElement("audio"); lecteur.controls = true; lecteur.src = url; lecteur.style.display = "block"; lecteur.style.margin = "6px 0";
      b.parentElement.querySelectorAll("audio").forEach(x => x.remove());
      b.insertAdjacentElement("afterend", lecteur); lecteur.play().catch(() => {});
    }
  } catch (e) {
    if (e.statut === 401) { ecrireMdp(""); pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); return; }
    alert("Lecture impossible : " + e.message);
  } finally { b.disabled = false; b.textContent = texte; }
});

// Remise à zéro d'un jour de « Fluidité verbale » : deux modes (garder ou supprimer les audios).
function reinitParole(empreinte, nom, jour) {
  const quoi = jour === "tous" ? "tous les jours" : "le jour " + jour;
  const fond = document.createElement("div");
  fond.className = "ov"; fond.setAttribute("role", "dialog"); fond.setAttribute("aria-modal", "true");
  fond.innerHTML = `<div class="ov-boite"><h3>Remettre à zéro ${esc(quoi)} · ${esc(nom)}</h3>
    <p>Les séances concernées (mesures, transcriptions, notes) et le statut « fait » sont effacés : l'élève devra refaire le jour. Que faire des enregistrements audio ?</p>
    <div class="ov-choix"><button class="btn" type="button" data-mode="garder">Remettre à zéro et GARDER les audios</button>
      <p class="small">Les audios restent dans l'archive privée, avec une sauvegarde des mesures, notes et transcriptions de la séance. Ils restent écoutables dans « Archive audio ».</p></div>
    <div class="ov-choix"><button class="btn btn--danger" type="button" data-mode="supprimer">Remettre à zéro et SUPPRIMER les audios</button>
      <p class="small">Les fichiers audio sont retirés de l'archive. Ils restent toutefois récupérables dans l'historique git du dépôt privé tant que celui-ci n'est pas purgé.</p></div>
    <button class="lien" type="button" data-mode="annuler">Annuler</button></div>`;
  document.body.append(fond);
  fond.addEventListener("click", async ev => {
    const mode = ev.target.dataset && ev.target.dataset.mode;
    if (ev.target === fond || mode === "annuler") { fond.remove(); return; }
    if (!mode) return;
    if (mode === "supprimer" && !confirm(`Supprimer les audios de ${quoi} pour ${nom} ? Cette action retire les fichiers de l'archive.`)) return;
    fond.querySelectorAll("button").forEach(b => { b.disabled = true; });
    let r;
    try { r = await appelerSuivi("/admin/parole/reinitialiser", { motdepasse: lireMdp(), empreinte, jour, audios: mode }, 90000); }
    catch (e) {
      fond.remove();
      if (e.statut === 401) { ecrireMdp(""); return pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); }
      alert("Remise à zéro non effectuée : " + e.message); return;
    }
    fond.remove();
    await afficher();
    document.getElementById("message").textContent = mode === "garder"
      ? `✓ ${nom} : ${quoi} remis à zéro. Audios conservés dans l'archive (${r.audiosConserves} fichier${r.audiosConserves > 1 ? "s" : ""}), avec la sauvegarde des données.`
      : `✓ ${nom} : ${quoi} remis à zéro. ${r.audiosSupprimes} audio${r.audiosSupprimes > 1 ? "s" : ""} supprimé${r.audiosSupprimes > 1 ? "s" : ""} de l'archive.`;
  });
}
const blocSeance = cle => document.querySelector(`.seance-p[data-cle="${cle}"]`);
function notesDuFormulaire(cle) {
  const b = blocSeance(cle), notes = { ex1: {}, ex2: {} };
  b.querySelectorAll("input[data-ex]").forEach(i => { notes[i.dataset.ex][i.dataset.c] = i.value === "" ? null : Number(i.value); });
  return notes;
}
function majTotaux(cle) {
  const b = blocSeance(cle); if (!b) return;
  const notes = notesDuFormulaire(cle);
  b.querySelectorAll("[data-total]").forEach(p => {
    const ex = p.dataset.total, t = totalExercice(ex, notes[ex]);
    p.textContent = t != null ? `Total : ${nf(t)} / ${GRILLE[ex].total}` : "Total : en attente des critères jugés";
  });
}
async function enregistrerNotes(cle) {
  const b = blocSeance(cle), msg = b.querySelector("[data-msg]");
  try {
    await appelerSuivi("/admin/parole/noter", { motdepasse: lireMdp(), cle, notes: notesDuFormulaire(cle), retour: b.querySelector("[data-retour]").value });
  } catch (e) {
    if (e.statut === 401) { ecrireMdp(""); return pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); }
    msg.textContent = "Échec : " + e.message; return;
  }
  await afficher();
  const nb = blocSeance(cle); if (nb) { nb.querySelector("[data-msg]").textContent = "✓ Notes enregistrées."; nb.scrollIntoView({ block: "center" }); }
}
async function relancerAnalyse(cle) {
  const b = blocSeance(cle), msg = b && b.querySelector("[data-msg]");
  try { await appelerSuivi("/admin/parole/analyser", { motdepasse: lireMdp(), cle }); }
  catch (e) {
    if (e.statut === 401) { ecrireMdp(""); return pageConnexion("Session expirée : saisissez de nouveau le mot de passe."); }
    if (msg) msg.textContent = "Relance impossible : " + e.message; return;
  }
  if (msg) msg.textContent = "Analyse relancée : actualisation dans quelques secondes…";
  setTimeout(afficher, 9000);
}
async function supprimerSeance(cle) {
  if (!confirm("Supprimer définitivement cette séance et ses notes ?")) return;
  try { await appelerSuivi("/admin/parole/supprimer", { motdepasse: lireMdp(), cle }); }
  catch (e) { alert("Échec : " + e.message); return; }
  await afficher();
}
function ouvrirParole() { const s = document.getElementById("parole-ens"); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); }
function initTotaux() { Object.keys(SEANCES).forEach(majTotaux); }

document.getElementById("quitter").addEventListener("click", () => { ecrireMdp(""); afficher(); });
afficher();
</script>
