<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="famzak-verrou.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoutineSite · 30 minutes par jour</title>
<meta name="description" content="Un rituel de 30 minutes par jour : deux parcours de 100 jours, Probabilités et Technologie numérique.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navbar">
  <div class="nav-left"><a class="famzak-retour" href="https://famzak.github.io/" title="Retour à FamZakSites" style="flex:none;white-space:nowrap;font-size:.85rem;color:#9fb3d6;text-decoration:none;margin-right:1rem">&larr; FamZakSites</a>
    <div class="logo-mark" aria-hidden="true">30'</div>
    <div class="logo-text">
      <span class="logo">RoutineSite</span>
      <span class="logo-tagline">30 minutes par jour</span>
    </div>
  </div>
  <nav class="nav-links" aria-label="Navigation">
    <a href="#" id="nav-accueil" class="active">Accueil</a>
    <button type="button" id="nav-quitter" hidden>Changer de code ZF</button>
  </nav>
</header>

<main class="page" id="contenu"></main>

<script src="commun.js"></script>
<script>
const ROUTINES = [
  {
    cle: "probabilites",
    titre: "Probabilités en 100 jours",
    texte: "Du langage du hasard à la loi binomiale et à la loi des grands nombres, en suivant les programmes de lycée de la rentrée 2026.",
    stats: [["100", "séances"], ["10", "modules"], ["2nde → Tle", "niveaux"]],
    modules: ["Le langage des probabilités", "Combiner des événements", "Expériences à plusieurs épreuves",
      "Fréquences, simulation, tableaux croisés", "Probabilités conditionnelles", "Indépendance et répétition",
      "Variables aléatoires", "Dénombrement", "Loi binomiale", "Sommes et grands nombres"],
    texteLien: "probabilites-100-jours-progression.md"
  },
  {
    cle: "technologie",
    titre: "Technologie numérique en 100 jours",
    texte: "De l'ordinateur à l'intelligence artificielle : SNT de seconde avec Python, puis NSI de première et de terminale et bases du supérieur.",
    stats: [["100", "séances"], ["10", "modules"], ["Collège → Sup", "niveaux"]],
    modules: ["L'ordinateur", "Coder l'information", "Réseaux et Internet", "Le Web", "Données et objets connectés",
      "Transmission et infrastructures", "Cybersécurité", "Au cœur de la machine", "Intelligence artificielle",
      "Perspectives et synthèse"],
    texteLien: "technologie-numerique-100-jours-progression.md"
  }
];

// ---------- Affichage ----------
function vignetteHtml(k) {
  return `<section class="vignette">
    <h2>${esc(k.nom)}</h2>
    <p class="niveau">${esc(k.niveau)}</p>
    <label class="code-label" for="code-${k.key}">Mon code ZF</label>
    <form class="champ-ligne" onsubmit="entrer('${k.key}'); return false;">
      <input class="input" id="code-${k.key}" type="text" placeholder="CODE ZF" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" type="submit">Entrer</button>
    </form>
    <p class="erreur" id="erreur-${k.key}" role="alert"></p>
  </section>`;
}
function routineHtml(r, session) {
  const faits = lireJours(r.cle, session.code);
  let prochain = 1;
  while (faits.includes(prochain) && prochain < 100) prochain++;
  const options = Array.from({ length: 100 }, (_, i) =>
    `<option value="${i + 1}"${i + 1 === prochain ? " selected" : ""}>Jour ${i + 1}${faits.includes(i + 1) ? " ✓" : ""}</option>`).join("");
  return `<article class="routine">
    <h3>${esc(r.titre)}</h3>
    <p>${esc(r.texte)}</p>
    <div class="stats">
      <div class="stat"><b>${faits.length}/100</b><span>jours terminés</span></div>
      <div class="stat"><b>10</b><span>modules</span></div>
      <div class="stat"><b>${esc(r.stats[2][0])}</b><span>niveaux</span></div>
    </div>
    ${badgesHtml(faits.length)}
    <details>
      <summary>Voir les 10 modules</summary>
      <ol>${r.modules.map(m => `<li>${esc(m)}</li>`).join("")}</ol>
    </details>
    <div class="jour-choix">
      <a class="btn" id="go-${r.cle}" href="jour.html?r=${r.cle}&j=${prochain}">Faire le jour ${prochain}</a>
      <label class="code-label" for="sel-${r.cle}">ou choisir un jour</label>
      <select class="input select" id="sel-${r.cle}" onchange="location.href='jour.html?r=${r.cle}&j='+this.value">${options}</select>
    </div>
    <div class="actions">
      <a class="btn btn--secondaire" href="seances.html?r=${r.cle}">Les 100 séances</a>
      <a class="btn btn--secondaire" href="${esc(r.texteLien)}">Progression (texte)</a>
    </div>
  </article>`;
}

function paroleHtml(session) {
  const faits = lireJours('parole', session.code);
  return `<article class="routine">
    <h3>Fluidité verbale en 100 jours</h3>
    <p>Parler sans s'arrêter : chaque jour, une association de mots (60 s) et un discours improvisé (2 min), mesurés dans le navigateur (pauses, débit, voix).</p>
    <div class="stats">
      <div class="stat"><b>${faits.length}/100</b><span>jours terminés</span></div>
      <div class="stat"><b>2</b><span>exercices oraux</span></div>
      <div class="stat"><b>Chrome</b><span>micro requis</span></div>
    </div>
    ${badgesHtml(faits.length)}
    <div class="actions">
      <a class="btn" href="parole.html">Faire ma séance du jour</a>
      <a class="btn btn--secondaire" href="seances.html?r=parole">Les 100 séances</a>
      <a class="btn btn--secondaire" href="parole.html#suivi">Mon suivi et ma note</a>
    </div>
  </article>`;
}

async function afficher() {
  const c = document.getElementById("contenu");
  const quitter = document.getElementById("nav-quitter");
  let s = lireSession();
  if (s && !(await codeValable(s.classe, s.code))) { ecrireSession(null); s = null; }
  quitter.hidden = !s;
  if (s) await synchroniserJours(s);
  if (s) {
    c.innerHTML = `<h1 class="titre">Routines</h1>
      <p class="sous-titre">Un rituel de 30 minutes par jour : ≈ 12 min d'apprentissage, puis 3 exercices corrigés.</p>
      <div class="vignettes vignettes--une">
        <section class="vignette vignette--active">
          <div class="espace-barre">
            <h2>Mon espace · ${esc(nomClasse(s.classe))}</h2>
            <button type="button" class="lien" onclick="sortir()">Changer de code ZF</button>
          </div>
          <p class="niveau">Deux parcours de 100 séances, 50 heures chacun.</p>
          ${serieHtml(s.code)}
          <div class="recherche" role="search">
            <input class="input input--recherche" id="recherche" type="search" placeholder="Chercher dans les 200 séances : loi binomiale, Python, IP…" aria-label="Chercher dans les séances" autocomplete="off" spellcheck="false">
            <div class="resultats" id="resultats" hidden aria-live="polite"></div>
          </div>
          <div class="routines">${ROUTINES.map(r => routineHtml(r, s)).join("")}${paroleHtml(s)}</div>
        </section>
      </div>`;
  } else {
    c.innerHTML = `<h1 class="titre">Routines</h1>
      <p class="sous-titre">Chaque classe a son espace : entrez votre code ZF dans la vignette de votre classe.</p>
      <div class="vignettes">${CLASSES.map(vignetteHtml).join("")}</div>`;
  }
  if (s) brancherRecherche();
  c.insertAdjacentHTML("beforeend", `<footer class="pied">RoutineSite · un rituel de 30 minutes par jour sur un sujet à approfondir. <a class="lien lien--discret" href="enseignant.html">Espace enseignant</a></footer>`);
}

// ---------- Recherche dans les séances ----------
// Les fichiers data/*.json sont lus à la première frappe. Chaque séance donne trois sortes d'entrées :
// la séance (titre et objectif), sa partie « Apprendre », et chacun de ses exercices (énoncé seulement :
// les corrigés et « À retenir » ne sont pas cherchés, pour ne rien dévoiler avant l'envoi).
// Un résultat ouvre jour.html sur la bonne partie (#apprendre, #exercice-2…).
let indexSeances = null;
const sansAccent = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function texteDe(html) {
  const d = new DOMParser().parseFromString(String(html || ""), "text/html");
  d.querySelectorAll("p,li,div,h3,h4,td,th,br,pre").forEach(n => n.after(" "));
  return d.body.textContent.replace(/\s+/g, " ").trim();
}
function chargerSeances() {
  if (indexSeances) return indexSeances;
  indexSeances = Promise.all(ROUTINES.map(r => fetch(`data/${r.cle}.json`).then(x => x.json()).then(d => {
    const l = [];
    d.jours.forEach(j => {
      const url = `jour.html?r=${r.cle}&j=${j.n}`, titre = `Jour ${j.n} · ${j.titreTxt || texteDe(j.titre)}`;
      const ajouter = (ancre, sous, texte) => l.push({ url: url + ancre, titre, sous: `${r.titre} · ${sous}`, texte, nt: sansAccent(titre), nx: sansAccent(texte) });
      ajouter("", j.niveau || "Séance", texteDe(j.objectif));
      ajouter("#apprendre", "Apprendre", texteDe(j.apprendre));
      (j.exercices || []).forEach((e, i) => ajouter(`#exercice-${i + 1}`, `Exercice ${i + 1} · ${texteDe(e.titre)}`, texteDe(e.enonce)));
    });
    return l;
  }).catch(() => []))).then(t => t.flat());
  return indexSeances;
}
function extraitSeance(e, mots) {
  let i = e.nx.indexOf(mots.join(" "));   // d'abord l'expression entière, puis chaque mot
  for (const m of mots) { if (i >= 0) break; i = e.nx.indexOf(m); }
  if (i < 0 || e.nx.length !== e.texte.length) return esc(e.texte.slice(0, 140)) + (e.texte.length > 140 ? "…" : "");
  let a = Math.max(0, i - 60); const b = Math.min(e.texte.length, i + 110);
  if (a > 0) { const sp = e.texte.indexOf(" ", a); if (sp > -1 && sp < i) a = sp + 1; }
  const brut = e.texte.slice(a, b), n = sansAccent(brut), r = [];
  mots.forEach(m => { let k = 0; while ((k = n.indexOf(m, k)) > -1) { r.push([k, k + m.length]); k += m.length; } });
  r.sort((x, y) => x[0] - y[0]);
  let out = "", pos = 0;
  r.forEach(([d, f]) => { if (d < pos) return; out += esc(brut.slice(pos, d)) + "<mark>" + esc(brut.slice(d, f)) + "</mark>"; pos = f; });
  return (a > 0 ? "…" : "") + out + esc(brut.slice(pos)) + (b < e.texte.length ? "…" : "");
}
function brancherRecherche() {
  const q = document.getElementById("recherche"), zone = document.getElementById("resultats");
  if (!q) return;
  q.addEventListener("focus", chargerSeances, { once: true });
  q.addEventListener("input", async () => {
    const brut = q.value.trim(), mots = sansAccent(brut).split(/\s+/).filter(m => m.length > 1 || /\d/.test(m));
    if (!mots.length) { zone.hidden = true; zone.innerHTML = ""; return; }
    const l = await chargerSeances();
    if (q.value.trim() !== brut) return;
    const res = l.map(e => {
      let sc = 0;
      for (const m of mots) { const t = e.nt.includes(m), x = e.nx.includes(m); if (!t && !x) return null; sc += (t ? 10 : 0) + (x ? 1 : 0); }
      return { e, sc };
    }).filter(Boolean).sort((a, b) => b.sc - a.sc);
    const vus = res.slice(0, 15);
    zone.innerHTML = res.length
      ? `<p class="resultats-tete">${res.length} passage${res.length > 1 ? "s" : ""}${res.length > vus.length ? ` (les ${vus.length} premiers)` : ""}</p>` +
        vus.map(({ e }) => `<a class="resultat" href="${esc(e.url)}"><b>${esc(e.titre)}</b><small>${esc(e.sous)}</small><span>${extraitSeance(e, mots)}</span></a>`).join("")
      : `<p class="resultats-tete">Aucune séance ne contient « ${esc(brut)} ».</p>`;
    zone.hidden = false;
  });
}

async function entrer(classe) {
  const input = document.getElementById(`code-${classe}`);
  const err = document.getElementById(`erreur-${classe}`);
  const code = normaliser(input.value);
  if (code.length < 6) {
    err.textContent = "Le code ZF comporte au moins 6 caractères : saisissez celui qui vous a été remis.";
    input.focus();
    return;
  }
  if (!(await codeValable(classe, code))) {
    const autre = await classeDuCode(code);
    err.textContent = autre
      ? `Ce code ZF est celui d'un élève de ${nomClasse(autre)} : utilisez la vignette ${nomClasse(autre)}.`
      : "Ce code ZF ne correspond à aucun élève de cette classe. Vérifiez-le.";
    input.focus();
    return;
  }
  ecrireSession({ classe, code });
  afficher();
}
function sortir() { ecrireSession(null); afficher(); }

document.getElementById("nav-quitter").addEventListener("click", sortir);
document.getElementById("nav-accueil").addEventListener("click", e => { e.preventDefault(); afficher(); });
afficher();
</script>
</body>
</html>
