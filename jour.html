<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="famzak-verrou.js?v=3" onerror="document.documentElement.hidden=true"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance du jour · RoutineSite</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="contenu.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
  .seance { max-width: none; }
  .seance-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .fil { color: var(--doux); font-size: 14px; margin: 0 0 6px; }
  .objectif { color: var(--doux); font-size: 17px; margin: 0 0 22px; }
  .bloc { background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; }
  .bloc h2 { margin: 0 0 14px; font-size: 20px; }
  .bloc h2 small { color: var(--doux); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .content { font-size: 17px; line-height: 1.65; }
  .exo { border-top: 1px solid var(--bord); padding-top: 16px; margin-top: 16px; }
  .exo:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .exo h3 { margin: 0 0 10px; font-size: 18px; }
  .etoiles { color: var(--ambre, #e3b053); letter-spacing: 2px; margin-left: 8px; font-size: 15px; }
  textarea.reponse {
    width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
    background: var(--fond); color: var(--texte); border: 1px solid var(--bord); border-radius: 6px;
    font: inherit; font-size: 16px; text-transform: none; letter-spacing: 0;
  }
  textarea.reponse:focus { outline: 2px solid var(--bleu); outline-offset: 1px; }
  .envoi { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .info { color: var(--doux); font-size: 14px; margin: 10px 0 0; }
  .ok { color: var(--vert); font-size: 15px; margin: 10px 0 0; }
  .corr { margin-top: 14px; border-left: 3px solid var(--vert); padding: 4px 0 0 16px; }
  .corr > .box-h { color: var(--vert); }
  .mes-corr .essai { border-top: 1px solid var(--bord); padding-top: 14px; margin-top: 14px; }
  .mes-corr .essai:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .mes-corr h3 { margin: 0 0 8px; font-size: 17px; }
  .mes-corr h3 small { color: var(--doux); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .score { font-size: 18px; font-weight: 700; color: var(--vert); margin: 0 0 8px; }
  .verdicts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
  .verdicts li { font-size: 13px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--bord); }
  .verdicts .juste { color: var(--vert); border-color: var(--vert); }
  .verdicts .partiel { color: var(--ambre, #e3b053); border-color: var(--ambre, #e3b053); }
  .verdicts .faux, .verdicts .vide { color: var(--rouge); border-color: var(--rouge); }
  .texte-corr { white-space: pre-wrap; font: inherit; font-size: 16px; line-height: 1.6; background: var(--fond); border: 1px solid var(--bord); border-radius: 8px; padding: 14px 16px; margin: 0; }
  .attente { color: var(--doux); font-size: 15px; margin: 0; }
  .mes-reponses summary { color: var(--doux); font-size: 14px; cursor: pointer; margin-top: 10px; }
  .mes-reponses pre { white-space: pre-wrap; font: inherit; font-size: 14px; color: var(--doux); margin: 6px 0 0; }
  .navjour { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header id="navbar">
  <div class="nav-left"><a class="famzak-retour" href="https://famzak.github.io/" title="Retour à FamZakSites" style="flex:none;white-space:nowrap;font-size:.85rem;color:#9fb3d6;text-decoration:none;margin-right:1rem">&larr; FamZakSites</a>
    <div class="logo-mark" aria-hidden="true">30'</div>
    <div class="logo-text">
      <span class="logo">RoutineSite</span>
      <span class="logo-tagline">30 minutes par jour</span>
    </div>
  </div>
  <nav class="nav-links" aria-label="Navigation">
    <a href="index.html">Accueil</a>
  </nav>
</header>

<main class="page seance" id="contenu"><p class="sous-titre">Chargement…</p></main>

<script src="commun.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script>
const ROUTINES = {
  probabilites: { nom: "Probabilités en 100 jours", court: "Probabilités", fichier: "data/probabilites.json" },
  technologie: { nom: "Technologie numérique en 100 jours", court: "Technologie numérique", fichier: "data/technologie.json" }
};

const params = new URLSearchParams(location.search);
const cleRoutine = ROUTINES[params.get("r")] ? params.get("r") : null;
let numero = parseInt(params.get("j"), 10);
if (!(numero >= 1 && numero <= 100)) numero = 1;

let session = null, jour = null;

function mathematiques(racine) {
  if (!window.katex) return;
  racine.querySelectorAll(".tex").forEach(el => {
    if (el.dataset.rendu) return;
    try {
      katex.render(el.textContent, el, { displayMode: el.classList.contains("tex-d"), throwOnError: false, strict: "ignore" });
      el.dataset.rendu = "1";
    } catch (e) {}
  });
}

function cleBrouillon(i) { return `routinesite:brouillon:${cleRoutine}:${numero}:${normaliser(session.code)}:${i}`; }
function cleEssais() { return `routinesite:essais:${cleRoutine}:${numero}:${normaliser(session.code)}`; }
function nbEssais() { try { return parseInt(localStorage.getItem(cleEssais()), 10) || 0; } catch (e) { return 0; } }
function lireBrouillon(i) { try { return localStorage.getItem(cleBrouillon(i)) || ""; } catch (e) { return ""; } }
function ecrireBrouillon(i, v) { try { localStorage.setItem(cleBrouillon(i), v); } catch (e) {} }

function afficherJour() {
  const R = ROUTINES[cleRoutine];
  const faits = lireJours(cleRoutine, session.code);
  const fait = faits.includes(numero);
  const c = document.getElementById("contenu");
  const precedent = numero > 1 ? `<a class="btn btn--secondaire" href="jour.html?r=${cleRoutine}&j=${numero - 1}">← Jour ${numero - 1}</a>` : "<span></span>";
  const suivant = numero < 100 ? `<a class="btn btn--secondaire" href="jour.html?r=${cleRoutine}&j=${numero + 1}">Jour ${numero + 1} →</a>` : "<span></span>";
  c.innerHTML = `
    <p class="fil"><a class="lien" href="index.html">← Mon espace</a> · ${esc(R.nom)} · ${esc(nomClasse(session.classe))}</p>
    <div class="seance-tete"><h1 class="titre">Jour ${numero} · ${esc(jour.titreTxt || jour.titre)}</h1></div>
    <p class="objectif">${esc(jour.niveau)} — ${esc(jour.objectif)}</p>

    <section class="bloc" id="apprendre"><h2>Apprendre <small>≈ 12 minutes</small></h2>
      <div class="content">${jour.apprendre}</div></section>

    <section class="bloc" id="exercices"><h2>Exercices <small>≈ 18 minutes · réponds aux trois puis envoie-les</small></h2>
      ${jour.exercices.map((e, i) => `
        <div class="exo" id="exercice-${i + 1}">
          <h3>Exercice ${i + 1} · ${esc(e.titre)}<span class="etoiles" aria-label="difficulté ${e.etoiles}">${"★".repeat(e.etoiles || 1)}</span></h3>
          <div class="content">${e.enonce}</div>
          <label class="code-label" for="rep-${i}">Ma réponse</label>
          <textarea class="reponse" id="rep-${i}" maxlength="900" placeholder="Écris ta réponse ici (démarche et résultat)."></textarea>
          <div class="corr" id="corr-${i}" hidden><div class="box-h">Corrigé</div><div class="content">${e.correction}</div></div>
        </div>`).join("")}
      <div class="envoi" style="margin-top:20px">
        <button type="button" class="btn" id="envoyer">Envoyer mes réponses</button>
        <button type="button" class="btn btn--secondaire" id="recommencer" hidden>↻ Recommencer (nouvel essai)</button>
        <span class="info" id="etat"></span>
      </div>
      <p class="info" id="essais">Tu peux refaire cette séance autant de fois que tu veux : chaque envoi est un essai conservé séparément, avec ses réponses et sa correction.</p>
      <p class="erreur" id="erreur" role="alert"></p>
      <div id="secours" hidden>
        <p class="info" id="secours-info">Rien ne s'est ouvert ? Utilise l'un de ces moyens, puis écris à l'adresse indiquée.</p>
        <div class="envoi"><a class="btn btn--secondaire" id="mailto" href="#">Ouvrir ma messagerie</a>
          <button type="button" class="btn btn--secondaire" id="copier">Copier le message</button>
          <a class="btn btn--secondaire" id="gmail" target="_blank" rel="noopener" href="#">Ouvrir dans Gmail</a></div>
      </div>
    </section>

    <section class="bloc mes-corr" id="corrections" hidden><h2>Ma correction</h2><div id="liste-corr"></div></section>
    <section class="bloc" id="retenir" hidden><h2>À retenir</h2>
      <div class="content"><div class="box box-retenir"><div class="box-h">À retenir</div><p>${jour.retenir}</p></div></div></section>

    <div class="navjour">${precedent}${suivant}</div>`;
  jour.exercices.forEach((_, i) => {
    const t = document.getElementById(`rep-${i}`);
    t.value = lireBrouillon(i);
    t.addEventListener("input", () => ecrireBrouillon(i, t.value));
  });
  document.getElementById("envoyer").addEventListener("click", envoyer);
  document.getElementById("recommencer").addEventListener("click", () => {
    jour.exercices.forEach((_, i) => { document.getElementById(`rep-${i}`).value = ""; ecrireBrouillon(i, ""); });
    document.getElementById("etat").textContent = "Nouvel essai : écris de nouvelles réponses puis envoie-les.";
    document.getElementById("secours").hidden = true;
    document.getElementById("rep-0").focus();
  });
  majEssais();
  if (fait) {
    document.getElementById("etat").textContent = "✓ Jour terminé : tes réponses ont été envoyées. Tu peux relire les corrigés.";
    revelerCorriges();
  }
  chargerCorrections();
  mathematiques(c);
  // Arrivée depuis la recherche (#apprendre, #exercice-2…) : la page est dessinée après chargement,
  // on amène donc la partie demandée à l'écran une fois le contenu en place.
  const cible = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (cible) cible.scrollIntoView({ block: "start" });
}

function majEssais() {
  const n = nbEssais();
  document.getElementById("recommencer").hidden = n === 0;
  if (n) document.getElementById("essais").textContent = `${n} essai${n > 1 ? "s" : ""} envoyé${n > 1 ? "s" : ""} sur cet appareil. Tu peux refaire cette séance autant de fois que tu veux : chaque envoi est un essai conservé séparément par ton enseignant, avec ses réponses.`;
}

function revelerCorriges() {
  jour.exercices.forEach((_, i) => { document.getElementById(`corr-${i}`).hidden = false; });
  document.getElementById("retenir").hidden = false;
  mathematiques(document.getElementById("contenu"));
}

function composerMessage() {
  const R = ROUTINES[cleRoutine];
  const date = new Date().toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
  const reponses = jour.exercices.map((e, i) =>
    `Exercice ${i + 1} (${e.titre}) :\n${document.getElementById(`rep-${i}`).value.trim()}`).join("\n\n");
  return {
    sujet: `RoutineSite · ${R.court} · Jour ${numero} · ${normaliser(session.code)} · essai ${nbEssais() + 1}`,
    corps: `Code : ${normaliser(session.code)} (${nomClasse(session.classe)})\nRoutine : ${R.nom}\nJour ${numero} : ${jour.titreTxt || jour.titre}\nEssai n° ${nbEssais() + 1}\nEnvoyé le : ${date}\n\n${reponses}\n`
  };
}

// ---------- Envoi : au serveur de suivi, qui fait corriger les réponses par Claude ; l'e-mail reste en secours ----------
const cleEnvoi = () => `routinesite:envoi:${cleRoutine}:${numero}:${normaliser(session.code)}`;
function preparerEmail(m, info) {
  const sujet = encodeURIComponent(m.sujet), corps = encodeURIComponent(m.corps);
  const mailto = `mailto:${ADRESSE_ENSEIGNANT}?subject=${sujet}&body=${corps}`;
  document.getElementById("mailto").href = mailto;
  document.getElementById("gmail").href =
    `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(ADRESSE_ENSEIGNANT)}&su=${sujet}&body=${corps}`;
  document.getElementById("copier").onclick = async () => {
    try { await navigator.clipboard.writeText(`À : ${ADRESSE_ENSEIGNANT}\nObjet : ${m.sujet}\n\n${m.corps}`); document.getElementById("etat").textContent = "Message copié."; }
    catch (e) { document.getElementById("etat").textContent = "Copie impossible : sélectionne et copie tes réponses à la main."; }
  };
  if (info) document.getElementById("secours-info").textContent = info;
  document.getElementById("secours").hidden = false;
  return mailto;
}
function marquerEnvoye() {
  try { localStorage.setItem(cleEssais(), String(nbEssais() + 1)); } catch (e) {}
  ajouterJour(cleRoutine, session.code, numero);
  majEssais();
  revelerCorriges();
}
async function envoyer() {
  const err = document.getElementById("erreur");
  const reponses = jour.exercices.map((_, i) => document.getElementById(`rep-${i}`).value.trim());
  if (reponses.some(r => !r)) {
    err.textContent = "Réponds aux trois exercices avant d'envoyer.";
    return;
  }
  err.textContent = "";
  const m = composerMessage();
  const bouton = document.getElementById("envoyer");
  if (URL_SUIVI) {
    // Le même identifiant est réutilisé si l'envoi précédent n'a pas eu de réponse : le serveur ne le corrige qu'une fois.
    let envoi = ""; try { envoi = localStorage.getItem(cleEnvoi()) || ""; } catch (e) {}
    if (!/^\d{10,14}$/.test(envoi)) { envoi = String(Date.now()); try { localStorage.setItem(cleEnvoi(), envoi); } catch (e) {} }
    bouton.disabled = true;
    document.getElementById("etat").textContent = "Envoi en cours…";
    try {
      const rep = await appelerSuivi("/reponses/envoyer", { classe: session.classe, code: session.code, routine: cleRoutine, jour: numero, envoi, reponses }, 20000);
      try { localStorage.removeItem(cleEnvoi()); } catch (e) {}
      bouton.disabled = false;
      if (!rep.deja) marquerEnvoye();
      const statut = rep.envoi && rep.envoi.statut;
      if (statut === "en_cours") {
        document.getElementById("etat").textContent = "✓ Réponses envoyées. Ta correction arrive dans quelques minutes, juste en dessous.";
        document.getElementById("secours").hidden = true;
      } else {
        document.getElementById("etat").textContent = "✓ Réponses enregistrées, mais la correction automatique n'est pas disponible pour le moment.";
        preparerEmail(m, "Envoie aussi tes réponses par e-mail à ton enseignant pour qu'il les corrige :");
      }
      await chargerCorrections();
      document.getElementById("corrections").scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    } catch (e) {
      bouton.disabled = false;
      if (e.statut && e.statut !== 404 && e.statut !== 503 && e.statut < 500) {   // refus explicite (code, quota…) : on l'affiche
        try { localStorage.removeItem(cleEnvoi()); } catch (x) {}
        err.textContent = e.message; document.getElementById("etat").textContent = ""; return;
      }
      // serveur injoignable ou pas encore mis à jour : on repasse par l'e-mail, comme avant
    }
  }
  const mailto = preparerEmail(m, "Le serveur ne répond pas : envoie tes réponses par e-mail. Rien ne s'est ouvert ? Utilise l'un de ces moyens.");
  location.href = mailto;
  marquerEnvoye();
  enregistrerJour(session, cleRoutine, numero);
  document.getElementById("etat").textContent = "✓ Jour validé sur cet appareil. Envoie le message qui vient de s'ouvrir : les corrigés sont affichés ci-dessous.";
}

// ---------- Corrections de Claude pour ce jour ----------
const LIBELLES = { juste: "juste", partiel: "en partie", faux: "à revoir", vide: "pas de réponse" };
let minuterie = null, debutAttente = 0;
const nfr = x => String(Math.round(Number(x) * 10) / 10).replace(".", ",");
function correctionHtml(e) {
  const date = new Date(e.date).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
  let corps;
  if (e.statut === "corrige" && e.correction) {
    const c = e.correction;
    const qs = (c.questions || []).map(q => `<li class="${esc(q.verdict)}" title="${esc(q.commentaire || "")}">Ex. ${q.exercice}${q.question ? " · " + esc(q.question) : ""} : ${esc(LIBELLES[q.verdict] || q.verdict)}</li>`).join("");
    corps = `<p class="score">${nfr(c.justes)} réponse${c.justes > 1 ? "s" : ""} juste${c.justes > 1 ? "s" : ""} sur ${c.total}</p>
      ${qs ? `<ul class="verdicts">${qs}</ul>` : ""}
      <pre class="texte-corr">${esc(c.texte)}</pre>
      <p class="info">${e.valide ? "Correction relue par ton enseignant." : "Correction rédigée par Claude (IA) d'après le corrigé du jour ; ton enseignant peut la relire et la modifier."}</p>`;
  } else if (e.statut === "en_cours") {
    corps = `<p class="attente">⏳ Correction en cours… Elle arrive en général en 2 à 5 minutes. Tu peux rester sur cette page ou revenir plus tard : elle t'attendra ici.</p>`;
  } else if (e.statut === "en_retard") {
    corps = `<p class="attente">La correction prend plus de temps que prévu. Reviens un peu plus tard ; sinon ton enseignant la fera.</p>`;
  } else if (e.statut === "echec") {
    corps = `<p class="attente">La correction automatique n'a pas abouti pour cet envoi. Ton enseignant a tes réponses et la relancera.</p>`;
  } else {
    corps = `<p class="attente">Réponses enregistrées. La correction automatique n'était pas disponible : ton enseignant corrigera cet envoi.</p>`;
  }
  return `<div class="essai"><h3>Essai ${e.essai || ""}<small>envoyé le ${esc(date)}</small></h3>${corps}
    <details class="mes-reponses"><summary>Revoir mes réponses</summary>${(e.reponses || []).map((r, i) => `<pre><b>Exercice ${i + 1} :</b> ${esc(r)}</pre>`).join("")}</details></div>`;
}
async function chargerCorrections() {
  if (!URL_SUIVI) return;
  let envois;
  try { envois = (await appelerSuivi("/reponses/etat", { classe: session.classe, code: session.code, routine: cleRoutine, jour: numero })).envois; }
  catch (e) { return; }   // serveur pas encore mis à jour ou injoignable : la page reste comme avant
  if (!envois || !envois.length) return;
  const sec = document.getElementById("corrections");
  sec.hidden = false;
  sec.querySelector("h2").textContent = envois.length > 1 ? "Mes corrections" : "Ma correction";
  document.getElementById("liste-corr").innerHTML = envois.slice().reverse().map(correctionHtml).join("");
  clearTimeout(minuterie);
  if (envois.some(e => e.statut === "en_cours")) {
    if (!debutAttente) debutAttente = Date.now();
    if (Date.now() - debutAttente < 30 * 60 * 1000) minuterie = setTimeout(chargerCorrections, 20000);
  } else debutAttente = 0;
}
(async function () {
  const c = document.getElementById("contenu");
  session = await sessionValide();
  if (!session) { location.replace("index.html"); return; }
  if (!cleRoutine) { c.innerHTML = `<p class="erreur">Routine inconnue. <a class="lien" href="index.html">Retour à mon espace</a></p>`; return; }
  try {
    const rep = await fetch(ROUTINES[cleRoutine].fichier);
    const donnees = await rep.json();
    jour = donnees.jours.find(j => j.n === numero);
    if (!jour) throw new Error("jour introuvable");
  } catch (e) {
    c.innerHTML = `<p class="erreur">Impossible de charger la séance (ouvre le site depuis son adresse en ligne, pas depuis un fichier). <a class="lien" href="index.html">Retour</a></p>`;
    return;
  }
  await synchroniserJours(session);
  document.title = `Jour ${numero} · ${ROUTINES[cleRoutine].court} · RoutineSite`;
  afficherJour();
  window.addEventListener("load", () => mathematiques(document.getElementById("contenu")));
})();
</script>
</body>
</html>
